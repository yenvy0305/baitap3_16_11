<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title><sitemesh:write property="title"/></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <sitemesh:write property="head"/>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-semibold" href="home">MVC3Tier</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#mainNavigation" aria-controls="mainNavigation"
                aria-expanded="false" aria-label="Mở menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNavigation">
            <div class="navbar-nav me-auto">
                <a class="nav-link" data-nav="member" href="home">Trang chủ</a>
                <a class="nav-link" data-nav="member" href="video">Video của tôi</a>
                <a class="nav-link" data-nav="member" href="profile">Hồ sơ</a>
            </div>
            <div class="navbar-nav">
                <a class="nav-link" data-nav="guest" href="login">Đăng nhập</a>
                <a class="nav-link" data-nav="member" href="logout">Đăng xuất</a>
            </div>
        </div>
    </div>
</nav>
<main class="container py-4">
    <sitemesh:write property="body"/>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"></script>
<script>
(() => {
    const guestPage = /\/(login|register|forgot-password|activate)$/.test(window.location.pathname);
    document.querySelectorAll('[data-nav="member"]').forEach((link) => {
        link.classList.toggle('d-none', guestPage);
    });
    document.querySelectorAll('[data-nav="guest"]').forEach((link) => {
        link.classList.toggle('d-none', !guestPage);
    });

    document.querySelectorAll('form.needs-validation').forEach((form) => {
        form.addEventListener('submit', (event) => {
            if (!form.checkValidity()) {
                event.preventDefault();
                event.stopPropagation();
            }
            form.classList.add('was-validated');
        });
    });
})();
</script>
</body>
</html>
